<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 0 950 1000">
    <!-- Styles -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
        </marker>
    </defs>

    <!-- Relationship lines (最背面に配置) -->
    <line x1="300" y1="230" x2="225" y2="300" stroke="#666" marker-end="url(#arrow)" />
    <line x1="400" y1="230" x2="625" y2="300" stroke="#666" marker-end="url(#arrow)" />
    <line x1="320" y1="230" x2="300" y2="500" stroke="#666" marker-end="url(#arrow)" />
    <line x1="400" y1="230" x2="500" y2="500" stroke="#666" marker-end="url(#arrow)" />

    <!-- Relationship labels -->
    <text x="180" y="250" font-size="12">contains</text>
    <text x="320" y="250" font-size="12">contains</text>
    <text x="470" y="250" font-size="12">contains</text>
    <text x="420" y="270" font-size="12">contains</text>

    <!-- PDREstimator -->
    <rect x="200" y="50" width="400" height="180" fill="#f0f0ff" stroke="#000" />
    <text x="400" y="80" text-anchor="middle" font-weight="bold">PDREstimator</text>
    <line x1="200" y1="90" x2="600" y2="90" stroke="#000" />
    <text x="210" y="110" font-size="14">-EnhancedSensorData sensor_data</text>
    <text x="210" y="130" font-size="14">-StepEstimator step_estimator</text>
    <text x="210" y="150" font-size="14">-OrientationEstimator orientation_estimator</text>
    <text x="210" y="170" font-size="14">-TrajectoryCalculator trajectory_calculator</text>
    <line x1="200" y1="190" x2="600" y2="190" stroke="#000" />
    <text x="210" y="210" font-size="14">+estimate_trajectory(): pd.DataFrame</text>

    <!-- EnhancedSensorData -->
    <rect x="-80" y="300" width="350" height="160" fill="#f0f0ff" stroke="#000" />
    <text x="95" y="330" text-anchor="middle" font-weight="bold">EnhancedSensorData</text>
    <line x1="-80" y1="340" x2="270" y2="340" stroke="#000" />
    <text x="-70" y="360" font-size="14">-pd.DataFrame _acc_df</text>
    <text x="-70" y="380" font-size="14">-pd.DataFrame _gyro_df</text>
    <text x="-70" y="400" font-size="14">-pd.DataFrame _corrected_orientation_df</text>
    <line x1="-80" y1="420" x2="270" y2="420" stroke="#000" />
    <text x="-70" y="440" font-size="14">+get_merged_data(): pd.DataFrame</text>

    <!-- StepEstimator -->
    <rect x="490" y="300" width="350" height="140" fill="#f0f0ff" stroke="#000" />
    <text x="665" y="330" text-anchor="middle" font-weight="bold">StepEstimator</text>
    <line x1="490" y1="340" x2="840" y2="340" stroke="#000" />
    <text x="500" y="360" font-size="14">-float step_length</text>
    <text x="500" y="380" font-size="14">-str step_length_model_path</text>
    <line x1="490" y1="400" x2="840" y2="400" stroke="#000" />
    <text x="500" y="420" font-size="14">+detect_step_times(): np.ndarray</text>

    <!-- OrientationEstimator -->
    <rect x="50" y="500" width="350" height="140" fill="#f0f0ff" stroke="#000" />
    <text x="225" y="530" text-anchor="middle" font-weight="bold">OrientationEstimator</text>
    <line x1="50" y1="540" x2="400" y2="540" stroke="#000" />
    <text x="60" y="560" font-size="14">-float drift_correction_factor</text>
    <line x1="50" y1="580" x2="400" y2="580" stroke="#000" />
    <text x="60" y="600" font-size="14">+calculate_full_orientation(): pd.DataFrame</text>
    <text x="60" y="620" font-size="14">+estimate_step_orientations(): pd.DataFrame</text>

    <!-- TrajectoryCalculator -->
    <rect x="450" y="500" width="350" height="140" fill="#f0f0ff" stroke="#000" />
    <text x="625" y="530" text-anchor="middle" font-weight="bold">TrajectoryCalculator</text>
    <line x1="450" y1="540" x2="800" y2="540" stroke="#000" />
    <text x="460" y="560" font-size="14">-dict initial_point</text>
    <text x="460" y="580" font-size="14">-bool flip_horizontal</text>
    <text x="460" y="600" font-size="14">-bool flip_vertical</text>
    <line x1="450" y1="610" x2="800" y2="610" stroke="#000" />
    <text x="460" y="630" font-size="14">+calculate_trajectory(): pd.DataFrame</text>

</svg>