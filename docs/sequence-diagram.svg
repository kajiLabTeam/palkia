<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <!-- Styles -->
    <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
        </marker>
        <marker id="return-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 10 0 L 0 5 L 10 10 z" fill="#666" stroke="none" />
        </marker>
        <marker id="self-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
        </marker>
    </defs>

    <!-- Lifelines -->
    <line x1="150" y1="100" x2="150" y2="550" stroke="#666" stroke-dasharray="4" />
    <line x1="400" y1="100" x2="400" y2="550" stroke="#666" stroke-dasharray="4" />
    <line x1="650" y1="100" x2="650" y2="550" stroke="#666" stroke-dasharray="4" />

    <!-- Class Boxes -->
    <rect x="100" y="30" width="100" height="40" fill="#f0f0ff" stroke="#666" />
    <text x="150" y="55" text-anchor="middle">Client</text>

    <rect x="350" y="30" width="100" height="40" fill="#f0f0ff" stroke="#666" />
    <text x="400" y="55" text-anchor="middle">Builder</text>

    <rect x="580" y="30" width="180" height="40" fill="#f0f0ff" stroke="#666" />
    <text x="670" y="55" text-anchor="middle">TrajectoryCorrector</text>

    <!-- Bottom Class Boxes -->
    <rect x="100" y="550" width="100" height="40" fill="#f0f0ff" stroke="#666" />
    <text x="150" y="575" text-anchor="middle">Client</text>

    <rect x="350" y="550" width="100" height="40" fill="#f0f0ff" stroke="#666" />
    <text x="400" y="575" text-anchor="middle">Builder</text>

    <rect x="580" y="550" width="180" height="40" fill="#f0f0ff" stroke="#666" />
    <text x="670" y="575" text-anchor="middle">TrajectoryCorrector</text>

    <!-- Sequence Messages -->
    <line x1="150" y1="120" x2="400" y2="120" stroke="#666" marker-end="url(#arrowhead)" />
    <text x="275" y="115" text-anchor="middle" font-size="12">with_floor_map(floor_map)</text>

    <line x1="150" y1="170" x2="400" y2="170" stroke="#666" marker-end="url(#arrowhead)" />
    <text x="275" y="165" text-anchor="middle" font-size="12">with_ground_truth(gt_data)</text>

    <line x1="150" y1="220" x2="400" y2="220" stroke="#666" marker-end="url(#arrowhead)" />
    <text x="275" y="215" text-anchor="middle" font-size="12">with_wireless_signal(signal_realtime_scans)</text>

    <line x1="150" y1="270" x2="400" y2="270" stroke="#666" marker-end="url(#arrowhead)" />
    <text x="275" y="265" text-anchor="middle" font-size="12">build()</text>

    <line x1="400" y1="320" x2="650" y2="320" stroke="#666" marker-end="url(#arrowhead)" />
    <text x="525" y="315" text-anchor="middle" font-size="12">create</text>

    <line x1="150" y1="370" x2="650" y2="370" stroke="#666" marker-end="url(#arrowhead)" />
    <text x="280" y="365" text-anchor="middle" font-size="12">estimate_and_correct_trajectory()</text>

    <!-- Self call for TrajectoryCorrector -->
    <path d="M 650 390 L 680 390 L 680 430 L 650 430" stroke="#666" fill="none" marker-end="url(#self-arrow)" />
    <text x="740" y="410" text-anchor="middle" font-size="12">apply corrections</text>

    <!-- Return Message (dotted line) -->
    <line x1="650" y1="480" x2="150" y2="480" stroke="#666" marker-end="url(#arrowhead)" />
    <text x="500" y="475" text-anchor="middle" font-size="12">corrected trajectory</text>

</svg>