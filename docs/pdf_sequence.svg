<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
    <!-- Styles -->
    <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
        </marker>
    </defs>

    <!-- Main PDREstimator container -->
    <rect x="100" y="50" width="600" height="750" fill="#ffffd8" stroke="#ccc" stroke-width="2" rx="5" />
    <text x="120" y="80" font-family="Arial" font-size="16">PDREstimator</text>

    <!-- Input box -->
    <rect x="300" y="0" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="400" y="25" text-anchor="middle" font-size="14">生センサデータ</text>

    <!-- EnhancedSensorData -->
    <rect x="300" y="120" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="400" y="145" text-anchor="middle" font-size="14">EnhancedSensorData</text>

    <!-- StepEstimator container -->
    <rect x="120" y="200" width="280" height="300" fill="#ffffd8" stroke="#ccc" stroke-width="2" rx="5" />
    <text x="140" y="230" font-family="Arial" font-size="16">StepEstimator</text>

    <!-- OrientationEstimator container -->
    <rect x="420" y="200" width="260" height="300" fill="#ffffd8" stroke="#ccc" stroke-width="2" rx="5" />
    <text x="520" y="230" font-family="Arial" font-size="16">OrientationEstimator</text>

    <!-- Step detection related boxes -->
    <rect x="160" y="260" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="260" y="285" text-anchor="middle" font-size="14">加速度データ取得</text>

    <rect x="160" y="340" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="260" y="365" text-anchor="middle" font-size="14">歩行検出</text>

    <rect x="160" y="420" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="260" y="445" text-anchor="middle" font-size="14">歩幅推定</text>

    <!-- Orientation related boxes -->
    <rect x="450" y="260" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="550" y="285" text-anchor="middle" font-size="14">角速度データ取得</text>

    <rect x="450" y="380" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="550" y="405" text-anchor="middle" font-size="14">方向推定</text>

    <!-- TrajectoryCalculator container -->
    <rect x="200" y="550" width="400" height="200" fill="#ffffd8" stroke="#ccc" stroke-width="2" rx="5" />
    <text x="330" y="580" font-family="Arial" font-size="16">TrajectoryCalculator</text>

    <!-- Trajectory boxes -->
    <rect x="300" y="600" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="400" y="625" text-anchor="middle" font-size="14">データ結合</text>

    <rect x="300" y="680" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="400" y="705" text-anchor="middle" font-size="14">軌跡計算</text>

    <!-- Output box -->
    <rect x="300" y="820" width="200" height="40" fill="#f0f0ff" stroke="#666" stroke-width="1" rx="3" />
    <text x="400" y="845" text-anchor="middle" font-size="14">推定軌跡</text>

    <!-- Connecting lines and arrows -->
    <g stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none">
        <!-- Main flow -->
        <path d="M 400 40 L 400 120" />
        <path d="M 400 160 L 260 260" />
        <path d="M 400 160 L 550 260" />

        <!-- Step detection flow -->
        <path d="M 260 300 L 260 340" />
        <path d="M 260 380 L 260 420" />
        <path d="M 260 380 L 450 400" />

        <!-- Orientation flow -->
        <path d="M 550 300 L 550 380" />

        <!-- Data fusion flow -->
        <path d="M 260 460 C 260,530 300,600 300,600" />
        <path d="M 550 420 C 550,530 500,600 500,600" />

        <!-- Final flow -->
        <path d="M 400 640 L 400 680" />
        <path d="M 400 720 L 400 820" />
    </g>

    <!-- Labels -->
    <g font-family="Arial" font-size="12" fill="#666">
        <text x="280" y="405" text-anchor="start">歩行タイミング</text>
        <text x="170" y="400" text-anchor="start">歩行タイミング</text>
        <text x="200" y="530" text-anchor="start">歩幅データ</text>
        <text x="600" y="530" text-anchor="end">方向データ</text>
    </g>
</svg>
